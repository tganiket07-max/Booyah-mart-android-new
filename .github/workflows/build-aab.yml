name: Build BOOYAH-MART AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android project
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Release AAB
        working-directory: project
        run: |
  set -o pipefail

  if [ -f "./gradlew" ]; then
    chmod +x ./gradlew
    ./gradlew bundleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
    STATUS=${PIPESTATUS[0]}
  else
    gradle bundleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
    STATUS=${PIPESTATUS[0]}
  fi

  if [ "$STATUS" -ne 0 ]; then
    echo "===== ACTUAL BUILD ERROR ====="
    grep -n -E "What went wrong:|Could not |Execution failed for task|AAPT2|error:" build.log | tail -50 || true
  fi

  exit "$STATUS"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: BOOYAH-MART-AAB
          path: project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
